<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbe3e6">
  <meta name="description" content="Sevgilimga xat — faqat sen uchun yozilgan maktub.">
  <title>Sevgilimga xat</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💌%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Great+Vibes&display=swap" rel="stylesheet">
  <style>
/* ===== Sevgilimga xat — uslublar ===== */
:root{
  --cream:#fff8f0;
  --cream-2:#fdeee6;
  --blush:#f9d9dd;
  --blush-2:#fbe9ea;
  --rose:#d98a98;
  --rose-deep:#a64d63;
  --ink:#5a3a40;
  --ink-soft:#8a6a70;
  --white:#fffdfb;
  --sage:#9db39a;
  --shadow:0 10px 30px rgba(166,77,99,.18);
  --script:"Great Vibes","Snell Roundhand","Apple Chancery",cursive;
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --hand:"Caveat","Segoe Script","Bradley Hand",cursive;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  font-family:var(--serif);
  font-size:20px;
  color:var(--ink);
  background:
    radial-gradient(1200px 600px at 10% -10%,var(--blush) 0,transparent 60%),
    radial-gradient(900px 600px at 100% 30%,#f6dfe0 0,transparent 55%),
    var(--cream);
  background-attachment:fixed;
  min-height:100vh;
  min-height:100dvh;
  overflow-x:hidden;
  line-height:1.55;
}
body.locked{overflow:hidden}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.script{font-family:var(--script);font-weight:400;color:var(--rose-deep);line-height:1.15}
.eyebrow{letter-spacing:.28em;text-transform:uppercase;font-size:.62em;color:var(--rose);font-weight:600}

/* ---- Tugmalar ---- */
.btn{
  display:inline-block;padding:.85em 2em;border-radius:999px;
  background:linear-gradient(135deg,#e7a0ae,var(--rose-deep));
  color:#fff;font-size:1rem;letter-spacing:.04em;font-weight:600;
  box-shadow:0 8px 22px rgba(166,77,99,.35);
  transition:transform .25s,box-shadow .25s;
}
.btn:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 12px 28px rgba(166,77,99,.42)}
.btn:active{transform:scale(.97)}
.btn.small{padding:.45em 1.1em;font-size:.8rem}
.btn.ghost{background:transparent;color:var(--rose-deep);border:1.5px solid var(--rose);box-shadow:none}
.btn.ghost:hover{background:var(--blush-2)}
.hint{font-size:.8rem;color:var(--ink-soft);font-style:italic;text-align:center;padding:0 1rem}

/* ---- Effektlar (gulbarg, yurak) ---- */
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.petal{
  position:absolute;top:-30px;width:var(--s);height:calc(var(--s)*1.3);
  background:radial-gradient(circle at 30% 30%,#fff 0,var(--c) 70%);
  border-radius:80% 0 80% 0;opacity:.85;
  animation:fall var(--d) linear forwards;
  will-change:transform;
}
@keyframes fall{
  0%{transform:translate3d(0,0,0) rotate(0)}
  50%{transform:translate3d(var(--x),55vh,0) rotate(180deg) rotateY(160deg)}
  100%{transform:translate3d(calc(var(--x)*-.6),112vh,0) rotate(360deg) rotateY(320deg);opacity:.5}
}
.fheart{
  position:absolute;bottom:-40px;left:var(--l);font-size:var(--s);color:var(--c);opacity:0;
  animation:floatUp var(--d) ease-in forwards;
}
@keyframes floatUp{
  0%{transform:translate(0,0) scale(.6);opacity:0}
  12%{opacity:.75}
  50%{transform:translate(var(--x),-55vh) scale(1)}
  100%{transform:translate(calc(var(--x)*-1),-112vh) scale(1.1);opacity:0}
}
.burst{
  position:fixed;pointer-events:none;z-index:50;font-size:18px;color:var(--rose-deep);
  animation:burst .9s ease-out forwards;
}
@keyframes burst{
  to{transform:translate(var(--dx),var(--dy)) scale(.4) rotate(var(--r));opacity:0}
}

/* ---- Musiqa tugmasi ---- */
.music-btn{
  position:fixed;top:calc(14px + env(safe-area-inset-top));right:14px;z-index:60;
  width:46px;height:46px;border-radius:50%;
  background:rgba(255,253,251,.9);border:1.5px solid var(--rose);
  color:var(--rose-deep);font-size:22px;box-shadow:var(--shadow);
  display:grid;place-items:center;transition:transform .2s;
}
.music-btn:hover{transform:scale(1.08)}
.music-btn .bars{display:none;gap:3px;align-items:flex-end;height:18px}
.music-btn .bars i{width:3px;background:var(--rose-deep);border-radius:2px;animation:eq .9s ease-in-out infinite}
.music-btn .bars i:nth-child(2){animation-delay:.25s}
.music-btn .bars i:nth-child(3){animation-delay:.5s}
@keyframes eq{0%,100%{height:5px}50%{height:18px}}
.music-btn.playing .note{display:none}
.music-btn.playing .bars{display:flex}

/* ---- Gul bezaklari ---- */
.corner{position:absolute;width:min(46vw,260px);pointer-events:none;z-index:1;animation:sway 7s ease-in-out infinite}
.corner.small{width:min(30vw,170px)}
.corner.tl{top:-6%;left:-8%;transform-origin:0 0}
.corner.tr{top:-3%;right:-6%;animation-delay:-2s}
.corner.bl{bottom:-3%;left:-6%;animation-delay:-3s}
.corner.br{bottom:-7%;right:-9%;animation-delay:-4s}
@keyframes sway{0%,100%{rotate:-3deg}50%{rotate:4deg}}
.flower svg,.corner svg,.divider svg,.paper-flower svg{width:100%;height:auto;display:block;filter:drop-shadow(0 6px 10px rgba(166,77,99,.25))}
.divider{width:70px;margin:2.2rem auto;opacity:.95;animation:sway 6s ease-in-out infinite}

/* ---- 1. Kirish sahifasi ---- */
.welcome{
  position:fixed;inset:0;z-index:40;display:grid;place-items:center;overflow:hidden;
  background:
    radial-gradient(700px 500px at 50% 40%,#fff5f0 0,transparent 70%),
    linear-gradient(160deg,#fde8e8,#f9d9dd 55%,#f3cdd3);
  transition:opacity 1.1s ease,visibility 1.1s;
}
.welcome.gone{opacity:0;visibility:hidden}
.welcome-inner{
  position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;
  gap:clamp(.8rem,2.6vh,1.5rem);text-align:center;padding:1rem;width:100%;
}
.welcome .eyebrow{animation:fadeUp 1.2s .1s both}
.welcome h1{font-size:clamp(2.6rem,11vw,4.6rem);animation:fadeUp 1.2s .5s both}
.welcome .btn{animation:fadeUp 1.2s .9s both}
.welcome .hint{animation:fadeUp 1.2s 1.2s both}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.welcome.opening .welcome-inner h1,
.welcome.opening .welcome-inner .eyebrow,
.welcome.opening .welcome-inner .hint{opacity:0;transition:opacity .6s;animation:none}
.welcome.opening .btn{opacity:0;pointer-events:none;transition:opacity .4s;animation:none}

/* ---- Konvert ---- */
.env{
  position:relative;width:min(78vw,330px);aspect-ratio:3/2;display:block;
  perspective:900px;animation:bob 4.5s ease-in-out infinite;filter:drop-shadow(0 18px 24px rgba(166,77,99,.28));
}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.env-back,.env-front,.env-flap,.env-letter{position:absolute;left:0;right:0}
.env-back{inset:0;border-radius:6px;background:linear-gradient(180deg,#efd0c4,#e8c3b7)}
.env-letter{
  top:8%;bottom:8%;left:7%;right:7%;background:var(--white);border-radius:4px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);z-index:1;
  transition:transform 1s cubic-bezier(.3,.9,.3,1) .5s;
  display:grid;place-items:center;
}
.mini-lines{display:block;width:60%;height:46%;
  background:repeating-linear-gradient(180deg,transparent 0 9px,rgba(217,138,152,.45) 9px 10px)}
.env-front{
  inset:0;z-index:2;border-radius:6px;pointer-events:none;
  background:linear-gradient(180deg,#f7e2d8,#f1d4c8);
  clip-path:polygon(0 0,50% 54%,100% 0,100% 100%,0 100%);
}
.env-front svg{position:absolute;inset:0;width:100%;height:100%}
.env-flap{
  top:0;height:55%;z-index:3;background:linear-gradient(180deg,#f3d5ca,#e9c4b8);
  clip-path:polygon(0 0,100% 0,50% 100%);
  transform-origin:50% 0;transition:transform .9s cubic-bezier(.5,0,.3,1),z-index 0s .35s;
}
.seal{
  position:absolute;left:50%;top:54%;width:17%;aspect-ratio:1;z-index:4;
  transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#e57c91,#b0405a 65%,#8d2f47);
  color:#ffe3e8;display:grid;place-items:center;font-size:clamp(18px,6vw,28px);
  box-shadow:0 4px 10px rgba(110,20,45,.45),inset 0 -3px 5px rgba(0,0,0,.2);
  animation:beat 1.6s ease-in-out infinite;
  transition:opacity .45s,transform .45s;
}
@keyframes beat{0%,100%{scale:1}15%{scale:1.14}30%{scale:1}45%{scale:1.1}}
.env.open{animation:none}
.env.open .env-flap{transform:rotateX(180deg);z-index:0}
.env.open .env-letter{transform:translateY(-62%)}
.env.open .seal{opacity:0;transform:translate(-50%,-50%) scale(1.7);animation:none}

/* ---- Asosiy sahifa ---- */
.main{position:relative;padding-bottom:110px}
.main:not([hidden]){animation:fadeIn 1.2s both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sec{position:relative;max-width:900px;margin:0 auto;padding:4.5rem 1.2rem 1rem}
.sec-head{text-align:center;margin-bottom:2.2rem}
.sec-head h2{font-size:clamp(2.6rem,10vw,4rem);margin-top:.3rem}
.sec-head .intro{max-width:34em;margin:.7rem auto 0;color:var(--ink-soft);font-style:italic;font-size:1.1rem}
.counter{margin-top:.7rem;color:var(--ink-soft);font-size:.95rem}
.counter b{color:var(--rose-deep);font-size:1.2em}

/* reveal */
.reveal{opacity:0;transform:translateY(26px);transition:opacity .9s ease,transform .9s ease}
.reveal.in{opacity:1;transform:none}

/* ---- 2. Xat ---- */
.paper{
  position:relative;max-width:640px;margin:0 auto;padding:2.2rem 1.6rem 2rem;
  background:
    linear-gradient(90deg,rgba(217,138,152,.35) 0 2px,transparent 2px) 2.2rem 0/100% 100% no-repeat,
    repeating-linear-gradient(180deg,transparent 0 35px,rgba(217,138,152,.2) 35px 36px),
    #fffbf4;
  border-radius:4px;box-shadow:var(--shadow),0 0 0 1px rgba(217,138,152,.2);
  transform:rotate(-.6deg);overflow:hidden;
  font-family:var(--hand);font-size:clamp(1.35rem,4.8vw,1.65rem);line-height:36px;color:#4b3036;
}
.paper::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle at 100% 0,rgba(220,170,150,.25),transparent 40%),radial-gradient(circle at 0 100%,rgba(220,170,150,.2),transparent 40%)}
.paper > *{position:relative}
.paper-flower{position:absolute!important;width:90px;top:-14px;right:-14px;opacity:.9;pointer-events:none}
.p-date{text-align:right;color:var(--ink-soft);font-size:.9em;padding-right:34px}
.p-greet{font-weight:600;margin:.4rem 0;color:var(--rose-deep);padding-left:1.1rem}
.paper p{padding-left:1.1rem}
.paper p.para{margin-bottom:36px;text-indent:1.4rem}
.p-close{margin-top:.2rem}
.p-sign{font-family:var(--script)!important;font-size:1.9em;color:var(--rose-deep);line-height:1.3;padding-top:.3rem}
.edit-bar{max-width:640px;margin:1rem auto 0;display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;justify-content:center;font-size:.85rem;color:var(--ink-soft);text-align:center}
body.editing .paper [contenteditable]{outline:1.5px dashed var(--rose);outline-offset:3px;border-radius:3px}

/* ---- 3. Hikoya ---- */
.timeline{list-style:none;position:relative;max-width:820px;margin:0 auto;padding-left:34px}
.timeline::before{content:"";position:absolute;left:11px;top:6px;bottom:6px;width:2px;
  background:linear-gradient(180deg,transparent,var(--rose) 8%,var(--rose) 92%,transparent)}
.t-item{position:relative;margin-bottom:2.4rem}
.t-dot{position:absolute;left:-34px;top:.9rem;width:24px;height:24px;border-radius:50%;
  background:var(--cream);border:2px solid var(--rose);display:grid;place-items:center;color:var(--rose-deep);font-size:12px;
  box-shadow:0 0 0 5px rgba(249,217,221,.7)}
.t-card{background:rgba(255,253,251,.92);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);border:1px solid rgba(217,138,152,.25)}
.t-photo{aspect-ratio:4/3;background:linear-gradient(135deg,var(--blush),var(--cream-2));overflow:hidden;position:relative;display:grid;place-items:center}
.t-photo img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 1.2s}
.t-card:hover .t-photo img{transform:scale(1.05)}
.t-photo .ph{width:34%;max-width:110px;opacity:.9}
.t-body{padding:1.1rem 1.3rem 1.3rem}
.t-date{font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--rose);font-weight:600}
.t-title{font-family:var(--script);font-size:2rem;color:var(--rose-deep);line-height:1.2;margin:.15rem 0 .35rem}
.t-text{font-size:1.08rem;color:var(--ink)}
.t-item.noph .t-photo{display:none}

/* ---- Hisoblagich ---- */
.love-counter{max-width:560px;margin:0 auto 2.8rem;padding:1.4rem 1rem 1.2rem;text-align:center;background:rgba(255,253,251,.92);border-radius:22px;box-shadow:var(--shadow);border:1px solid rgba(217,138,152,.3)}
.love-counter h3{font-family:var(--script);font-weight:400;font-size:clamp(1.8rem,7vw,2.4rem);color:var(--rose-deep);line-height:1.2;margin-bottom:1rem}
.c-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.c-box{background:linear-gradient(160deg,#fff3ee,var(--blush-2));border:1px solid rgba(217,138,152,.3);border-radius:14px;padding:.7rem .2rem .55rem;display:flex;flex-direction:column;align-items:center;min-width:0}
.c-box b{font-size:clamp(1.7rem,8vw,2.5rem);line-height:1.1;color:var(--rose-deep);font-weight:600;font-variant-numeric:tabular-nums}
.c-box span{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin-top:.15rem}
.love-counter p{margin-top:1rem;font-style:italic;color:var(--ink-soft);font-size:1.02rem}

/* ---- 4. Kartalar ---- */
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;max-width:760px;margin:0 auto}
.card{perspective:900px;aspect-ratio:3/4;position:relative}
.card-in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.4,.2,.2,1);cursor:pointer;border-radius:18px}
.card.flipped .card-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:.9rem;box-shadow:var(--shadow);overflow:hidden}
.face.front{background:linear-gradient(160deg,#fff3ee,var(--blush));border:1.5px solid rgba(217,138,152,.45)}
.face.front::before{content:"";position:absolute;inset:8px;border:1px dashed rgba(166,77,99,.35);border-radius:12px}
.face.front .mini{width:44%;margin-bottom:.6rem}
.face.front .mini svg{width:100%;display:block}
.face.front h3{font-family:var(--script);font-weight:400;color:var(--rose-deep);font-size:clamp(1.4rem,5.4vw,2.1rem);line-height:1.15;overflow-wrap:anywhere;hyphens:auto;max-width:100%;padding:0 .2rem}
.face.front small{margin-top:.5rem;font-size:.72rem;color:var(--ink-soft);letter-spacing:.12em;text-transform:uppercase}
.face.back{transform:rotateY(180deg);background:linear-gradient(160deg,var(--rose-deep),#c26579);color:#fff5f6}
.face.back p{font-size:clamp(.95rem,3.5vw,1.15rem);line-height:1.4}
.face.back .hh{font-size:1.3rem;margin-bottom:.5rem;opacity:.85}
.card:focus-visible .card-in{outline:3px solid var(--rose-deep);outline-offset:3px}
.all-done{text-align:center;font-family:var(--script);font-size:clamp(1.8rem,7vw,2.5rem);color:var(--rose-deep);margin:2rem auto 0;max-width:20em;animation:fadeUp 1s both}

/* ---- 5. Kelajak ---- */
.dreams{display:grid;gap:16px;max-width:760px;margin:0 auto}
.dream{display:flex;gap:1rem;align-items:flex-start;background:rgba(255,253,251,.9);border-radius:18px;padding:1.2rem 1.2rem;
  box-shadow:var(--shadow);border:1px solid rgba(217,138,152,.25)}
.dream .ic{flex:none;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:28px;background:linear-gradient(135deg,var(--blush),#fff0ee);box-shadow:inset 0 0 0 1.5px rgba(217,138,152,.45)}
.dream h3{font-family:var(--script);font-weight:400;font-size:1.95rem;color:var(--rose-deep);line-height:1.2}
.dream p{font-size:1.08rem}
.quote{margin:2.4rem auto 0;max-width:20em;text-align:center;font-family:var(--script);font-size:clamp(1.9rem,7vw,2.6rem);color:var(--rose-deep);line-height:1.3;position:relative;padding:0 .5rem}
.quote::before,.quote::after{content:"❦";display:block;color:var(--rose);font-family:var(--serif);font-size:1.1rem;margin:.4rem 0}

/* ---- 6. Sirli xabar ---- */
.secret-env{margin:0 auto;cursor:pointer;width:min(72vw,300px)}
.secret-env:focus-visible{outline:3px solid var(--rose-deep);outline-offset:8px;border-radius:8px}
#secret .hint{margin-top:1.1rem}
.secret-card{
  max-width:560px;margin:0 auto;max-height:0;opacity:0;overflow:hidden;
  transition:max-height 1.2s ease,opacity 1s ease .2s,margin .8s;
}
.secret-card.show{max-height:900px;opacity:1;margin-top:2.2rem}
.secret-card p{
  background:linear-gradient(160deg,#fffbf4,#fdeee6);border-radius:16px;padding:1.6rem 1.4rem;text-align:center;
  font-family:var(--hand);font-size:clamp(1.4rem,5vw,1.75rem);line-height:1.5;color:#4b3036;box-shadow:var(--shadow);
  border:1.5px solid rgba(217,138,152,.35);min-height:4em;
}
.secret-card p.typing::after{content:"♡";margin-left:4px;color:var(--rose-deep);animation:blink .8s infinite}
@keyframes blink{50%{opacity:0}}

/* ---- 7. Yakun ---- */
.final{min-height:100vh;min-height:100dvh;display:grid;place-items:center;max-width:none;padding:4rem 1.2rem;overflow:hidden}
.final-inner{position:relative;z-index:2;text-align:center;max-width:620px}
.final-heart{font-size:clamp(4rem,18vw,6.5rem);color:var(--rose-deep);animation:beat 1.8s ease-in-out infinite;filter:drop-shadow(0 8px 14px rgba(166,77,99,.35));display:inline-block}
.final-line{font-size:clamp(2.3rem,9.5vw,3.8rem);margin:1rem 0 .6rem}
.final-sub{font-size:1.2rem;color:var(--ink-soft);font-style:italic;margin-bottom:1.8rem}
.final .corner.tl{top:2%;left:-6%}
.final .corner.br{bottom:2%;right:-6%}

/* ---- Pastki menyu ---- */
.nav{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));z-index:55;
  display:flex;gap:4px;padding:6px;border-radius:999px;background:rgba(255,253,251,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:var(--shadow);border:1px solid rgba(217,138,152,.35);
}
.nav a{display:grid;place-items:center;min-width:34px;height:34px;padding:0 .2rem;border-radius:999px;color:var(--ink-soft);text-decoration:none;font-size:.78rem;transition:.25s}
.nav a .lab{display:none}
.nav a .dot{font-size:15px}
.nav a.active{background:linear-gradient(135deg,#e7a0ae,var(--rose-deep));color:#fff}
@media(min-width:640px){
  .nav a{padding:0 .9rem}
  .nav a .dot{display:none}
  .nav a .lab{display:inline;font-size:.85rem;letter-spacing:.04em}
  .cards{grid-template-columns:repeat(4,1fr);gap:18px}
  .timeline{padding-left:0}
  .timeline::before{left:50%;margin-left:-1px}
  .t-item{width:50%;padding-right:2.6rem}
  .t-item:nth-child(even){margin-left:50%;padding-right:0;padding-left:2.6rem}
  .t-dot{left:auto;right:-12px}
  .t-item:nth-child(even) .t-dot{right:auto;left:-12px}
  .paper{padding:2.8rem 3rem 2.4rem}
}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  #fx{display:none}
}

  </style>
</head>
<body class="locked">

  <!-- Tushayotgan gulbarglar va suzuvchi yuraklar -->
  <div id="fx" aria-hidden="true"></div>

  <!-- Musiqa tugmasi -->

    g.gain.exponentialRampToValueAtTime(.0008, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + .05);
  };
  Synth.prototype.bar = function () {
    var c = this.ctx, t = c.currentTime + .05, i = this.step % 4, beat = .62;
    var ch = this.prog[i], me = this.mel[i];
    for (var b = 0; b < 4; b++) {
      this.note(ch[b % 4] - 12, t + b * beat, 1.6, .12, "triangle");
      this.note(ch[(b + 1) % 4], t + b * beat + beat / 2, 1.1, .05, "sine");
      this.note(me[b], t + b * beat, 1.5, .09, "sine");
    }
    this.step++;
  };
  Synth.prototype.start = function () {
    var self = this, c = this.ctx;
    if (c.state === "suspended") c.resume();
    this.master.gain.cancelScheduledValues(c.currentTime);
    this.master.gain.linearRampToValueAtTime(S.music.volume || .6, c.currentTime + 1.2);
    if (this.timer) return;
    this.bar();
    this.timer = setInterval(function () { self.bar(); }, 4 * .62 * 1000);
  };
  Synth.prototype.stop = function () {
    var c = this.ctx;
    this.master.gain.cancelScheduledValues(c.currentTime);
    this.master.gain.linearRampToValueAtTime(0, c.currentTime + .5);
    clearInterval(this.timer); this.timer = null;
    setTimeout(function () { if (!playing && c.state === "running") c.suspend(); }, 700);
  };

  function setPlayingUI(p) {
    playing = p;
    musicBtn.classList.toggle("playing", p);
    musicBtn.setAttribute("aria-pressed", String(p));
    musicBtn.setAttribute("aria-label", p ? "Musiqani to‘xtatish" : "Musiqani yoqish");
  }
  function startSynth() {
    try {
      if (!synth) synth = new Synth();
      synth.start(); useSynth = true; setPlayingUI(true);
    } catch (e) { setPlayingUI(false); }
  }
  function startMusic() {
    if (useSynth) { startSynth(); return; }
    audio.volume = S.music.volume || .6;
    var pr;
    try { pr = audio.play(); } catch (e) { pr = null; }
    if (pr && pr.then) {
      pr.then(function () { setPlayingUI(true); }).catch(function () { startSynth(); });
    } else { startSynth(); }
  }
  function stopMusic() {
    if (useSynth && synth) synth.stop(); else audio.pause();
    setPlayingUI(false);
  }
  if (S.music && S.music.file) audio.src = S.music.file;
  audio.addEventListener("error", function () { if (playing && !useSynth) startSynth(); });
  musicBtn.addEventListener("click", function () { playing ? stopMusic() : startMusic(); });

  /* ---------------- Matnlarni joylash ---------------- */
  document.title = S.pageTitle || document.title;
  $("wEyebrow").textContent = S.welcome.eyebrow;
  $("wTitle").textContent = S.welcome.title;
  $("openBtn").textContent = S.welcome.button;
  $("wHint").textContent = S.welcome.musicHint;

  // Xat
  var L = S.letter;
  $("lEyebrow").textContent = L.eyebrow;
  $("lTitle").textContent = L.title;
  $("lDate").textContent = L.date;
  $("lGreet").textContent = L.greeting;
  $("lClose").textContent = L.closing;
  $("lSign").textContent = L.signature;
  var lBody = $("lBody");
  function renderLetterBody(paras) {
    lBody.innerHTML = "";
    paras.forEach(function (t) { lBody.appendChild(el("p", "para", t)); });
  }
  renderLetterBody(L.paragraphs);

  // Tahrirlash rejimi: sahifa manzili oxiriga ?edit=1 qo'shing
  var isEdit = /[?&]edit=1/.test(location.search);
  var EDIT_IDS = ["lDate", "lGreet", "lClose", "lSign"];
  if (isEdit) {
    var saved = store("sx_letter");
    if (saved) {
      try {
        var d = JSON.parse(saved);
        EDIT_IDS.forEach(function (i) { if (d[i]) $(i).textContent = d[i]; });
        if (d.paras && d.paras.length) renderLetterBody(d.paras);
      } catch (e) {}
    }
    document.body.classList.add("editing");
    $("editBar").hidden = false;
    var editables = function () { return [].slice.call($("paper").querySelectorAll("#lDate,#lGreet,#lClose,#lSign,#lBody p")); };
    editables().forEach(function (n) { n.setAttribute("contenteditable", "true"); });
    var collect = function () {
      var o = { paras: [] };
      EDIT_IDS.forEach(function (i) { o[i] = $(i).textContent; });
      [].forEach.call(lBody.querySelectorAll("p"), function (p) { o.paras.push(p.textContent); });
      return o;
    };
    $("paper").addEventListener("input", function () { store("sx_letter", JSON.stringify(collect())); });
    $("copyBtn").addEventListener("click", function () {
      var o = collect();
      var txt = o.lDate + "\n\n" + o.lGreet + "\n\n" + o.paras.join("\n\n") + "\n\n" + o.lClose + "\n" + o.lSign;
      var done = function () { $("copyBtn").textContent = "Nusxalandi ✓"; setTimeout(function () { $("copyBtn").textContent = "Matnni nusxalash"; }, 1800); };
      if (navigator.clipboard) navigator.clipboard.writeText(txt).then(done, done); else done();
    });
    $("resetBtn").addEventListener("click", function () { store("sx_letter", null); location.reload(); });
  }

  // Hikoya
  $("sEyebrow").textContent = S.story.eyebrow;
  $("sTitle").textContent = S.story.title;
  // Jonli hisoblagich
  var C = S.story.counter;
  if (C && C.startDate) {
    $("cTitle").textContent = C.title;
    $("cFoot").textContent = C.footer;
    [].forEach.call($("loveCounter").querySelectorAll(".c-box span"), function (sp, i) { sp.textContent = C.labels[i]; });
    var start = new Date(C.startDate).getTime();
    var tick = function () {
      var t = Math.max(0, Math.floor((Date.now() - start) / 1000));
      $("cD").textContent = Math.floor(t / 86400);
      $("cH").textContent = Math.floor(t % 86400 / 3600);
      $("cM").textContent = Math.floor(t % 3600 / 60);
      $("cS").textContent = t % 60;
    };
    if (isNaN(start)) { $("loveCounter").hidden = true; } else { tick(); setInterval(tick, 1000); }
  } else { $("loveCounter").hidden = true; }

  var tl = $("timeline");
  S.story.items.forEach(function (it) {
    var li = el("li", "t-item reveal");
    li.appendChild(el("span", "t-dot", "♥")).setAttribute("aria-hidden", "true");
    var card = el("div", "t-card");
    var ph = el("div", "t-photo");
    var ph_fallback = function () { ph.innerHTML = ""; var f = el("div", "ph flower"); f.setAttribute("data-flower", "peony"); ph.appendChild(f); fillFlowers(ph); };
    if (it.photo) {
      var img = new Image();
      img.alt = it.title || "";
      img.loading = "lazy";
      img.onerror = ph_fallback;
      img.src = it.photo;
      ph.appendChild(img);
    } else { li.classList.add("noph"); }
    card.appendChild(ph);
    var body = el("div", "t-body");
    body.appendChild(el("div", "t-date", it.date));
    body.appendChild(el("h3", "t-title", it.title));
    body.appendChild(el("p", "t-text", it.text));
    card.appendChild(body);
    li.appendChild(card);
    tl.appendChild(li);
  });

  // Sabablar
  var R = S.reasons;
  $("rEyebrow").textContent = R.eyebrow;
  $("rTitle").textContent = R.title;
  $("rTotal").textContent = R.items.length;
  $("rCounterText").textContent = R.counterText;
  $("rDone").textContent = R.allDone;
  var opened = 0, cardsBox = $("cards");
  R.items.forEach(function (it, i) {
    var card = el("div", "card reveal");
    card.tabIndex = 0; card.setAttribute("role", "button");
    card.setAttribute("aria-label", it.front + " — kartani ochish");
    var inn = el("div", "card-in");
    var fr = el("div", "face front");
    var mini = el("div", "mini"); mini.setAttribute("data-flower", i % 2 ? "rose" : "peony");
    fr.appendChild(mini);
    fr.appendChild(el("h3", null, it.front));
    fr.appendChild(el("small", null, "Bosing ♡"));
    var bk = el("div", "face back");
    bk.appendChild(el("div", "hh", "♥"));
    bk.appendChild(el("p", null, it.back));
    inn.appendChild(fr); inn.appendChild(bk); card.appendChild(inn);
    var seen = false;
    function flip() {
      card.classList.toggle("flipped");
      var isOpen = card.classList.contains("flipped");
      card.setAttribute("aria-label", it.front + (isOpen ? " — kartani yopish" : " — kartani ochish"));
      if (isOpen) {
        burstEl(card);
        if (!seen) {
          seen = true; opened++;
          $("rCount").textContent = opened;
          if (opened === R.items.length) {
            $("rDone").hidden = false;
            setTimeout(function () { $("rDone").scrollIntoView({ behavior: "smooth", block: "center" }); burst(innerWidth / 2, innerHeight / 2, 22); }, 700);
          }
        }
      }
    }
    card.addEventListener("click", flip);
    card.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); flip(); } });
    cardsBox.appendChild(card);
  });

  // Kelajak
  var F = S.future;
  $("fEyebrow").textContent = F.eyebrow;
  $("fTitle").textContent = F.title;
  $("fIntro").textContent = F.intro;
  $("fQuote").textContent = F.quote;
  F.items.forEach(function (it) {
    var d = el("div", "dream reveal");
    d.appendChild(el("div", "ic", it.icon));
    var t = el("div");
    t.appendChild(el("h3", null, it.title));
    t.appendChild(el("p", null, it.text));
    d.appendChild(t);
    $("dreams").appendChild(d);
  });

  // Sirli xabar
  var X = S.secret;
  $("xEyebrow").textContent = X.eyebrow;
  $("xTitle").textContent = X.title;
  $("xHint").textContent = X.hint;
  $("xSeal").textContent = X.envelopeText || "♥";
  var secretOpen = false, typeTimer = null;
  $("secretEnv").addEventListener("click", function () {
    var env = $("secretEnv"), card = $("secretCard"), txt = $("secretText");
    secretOpen = !secretOpen;
    env.classList.toggle("open", secretOpen);
    clearInterval(typeTimer);
    if (secretOpen) {
      burstEl(env);
      $("xHint").style.visibility = "hidden";
      setTimeout(function () {
        card.classList.add("show");
        txt.textContent = "";
        if (reduce) { txt.textContent = X.message; return; }
        txt.classList.add("typing");
        var i = 0;
        typeTimer = setInterval(function () {
          i += 2; txt.textContent = X.message.slice(0, i);
          if (i >= X.message.length) { clearInterval(typeTimer); txt.classList.remove("typing"); burst(innerWidth / 2, innerHeight * .6, 14); }
        }, 35);
        setTimeout(function () { card.scrollIntoView({ behavior: "smooth", block: "center" }); }, 500);
      }, 900);
    } else {
      card.classList.remove("show");
      $("xHint").style.visibility = "visible";
    }
  });

  // Yakun
  $("finalLine").textContent = S.final.line;
  $("finalSub").textContent = S.final.sub;
  $("restartBtn").textContent = S.final.restart;
  $("restartBtn").addEventListener("click", function () {
    document.getElementById("letter").scrollIntoView({ behavior: "smooth" });
  });

  // Menyu
  var sections = ["letter", "story", "reasons", "future", "secret", "final"];
  var nav = $("nav");
  sections.forEach(function (id, i) {
    var a = el("a");
    a.href = "#" + id;
    a.setAttribute("aria-label", S.navLabels[i]);
    a.appendChild(el("span", "dot", "♡"));
    a.appendChild(el("span", "lab", S.navLabels[i]));
    nav.appendChild(a);
  });

  fillFlowers();

  /* ---------------- Ochilish ketma-ketligi ---------------- */
  var opening = false;
  $("openBtn").addEventListener("click", function (e) {
    if (opening) return;
    opening = true;
    var w = $("welcome");
    w.classList.add("opening");
    $("env").classList.add("open");
    burst(e.clientX || innerWidth / 2, e.clientY || innerHeight / 2, 12);
    setTimeout(function () {
      $("main").hidden = false;
      nav.hidden = false;
      document.body.classList.remove("locked");
      window.scrollTo(0, 0);
      watch();
      w.classList.add("gone");
      for (var i = 0; i < 14; i++) setTimeout(addHeart, i * 120);
    }, 2300);
    setTimeout(function () { w.style.display = "none"; }, 3600);
  });
  $("env").addEventListener("click", function () { $("openBtn").click(); });
  $("env").style.cursor = "pointer";

  /* ---------------- Scroll animatsiyalari va menyu ---------------- */
  var watched = false;
  function watch() {
    if (watched) return; watched = true;
    var items = document.querySelectorAll(".reveal");
    if (!("IntersectionObserver" in window)) {
      [].forEach.call(items, function (n) { n.classList.add("in"); });
    } else {
      var io = new IntersectionObserver(function (ents) {
        ents.forEach(function (en) { if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); } });
      }, { threshold: .12 });
      [].forEach.call(items, function (n) { io.observe(n); });
      var links = nav.querySelectorAll("a");
      var so = new IntersectionObserver(function (ents) {
        ents.forEach(function (en) {
          if (en.isIntersecting) {
            [].forEach.call(links, function (a) { a.classList.toggle("active", a.getAttribute("href") === "#" + en.target.id); });
          }
        });
      }, { rootMargin: "-45% 0px -50% 0px" });
      sections.forEach(function (id) { so.observe($(id)); });
    }
  }
})();

  </script>
</body>
